# 公開版 tacpendium の見張るパスが、upstream/tacpendium.lock の基準から変わったかを調べる。
# 変化があれば赤で終わる(定期実行の失敗通知を知らせとして使う)。リポジトリへは何も書き込まない。
# 中身は upstream/watch.sh(ローカルでも同じものを回せる)。
name: Upstream watch

on:
  workflow_dispatch:
  # 日 1 回(09:13 JST)。公開後に再開した(開発者決定 2026-10-18。public は Actions が無料)。
  schedule:
    - cron: "13 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare upstream
        run: bash upstream/watch.sh
