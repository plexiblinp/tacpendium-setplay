# サイトを Cloudflare Workers へ出す(S9・HANDOVER §3・§7.4。公開物は CI からだけ出す＝AGENTS §8-12)。
# 起動:
#   - CI(ci.yml)が main への push で成功したとき(workflow_run)。CI が検査したコミット(head_sha)そのものを出す。
#     ★workflow_run はフォークの PR の CI の完了でも起動し、しかも main の扱いで動く(Environment の branch の制限が効かない)。
#       そのため「main への push・同じリポジトリ・成功」の 3 つを job の if で確かめる。
#   - 手動(workflow_dispatch。main の今の HEAD を出し直す。CI の結果は見ないので、緑を確かめてから押す)。
# job を 2 つに分ける(S9 の対策 R-1。AGENTS §9 の「job を増やさない」は ci.yml の分数の話で、public なので分数は無料):
#   - build: トークンを持たない。CI と同じ手順で web/dist を作り、成果物として渡す。
#   - deploy: Environment `production`(必須の承認者・main だけ。設定は開発者)。トークンは wrangler deploy の 1 段だけに渡す。
#     依存は lockfile どおりに入れ、install のスクリプトは動かさない。動くのは wrangler とその依存だけ。
# キャッシュは使わない(書き込まれたキャッシュから生成物や道具を差し替えられる経路を消す)。
# 要るもの(開発者が Settings → Environments → production の Environment secrets に置く。Repository secret には置かない):
#   CLOUDFLARE_API_TOKEN   … アカウント所有・Workers Scripts: Edit・自分のアカウントだけ・有効期限つき(docs/telemetry.md)
#   CLOUDFLARE_ACCOUNT_ID  … アカウント ID
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# デプロイの途中で打ち切らない(古い実行は待たせ、順に出す)。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: 出すコミット
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REF_SHA: ${{ github.sha }}
        run: |
          sha="${RUN_SHA:-$REF_SHA}"
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then echo "SHA を読めなかった: $sha"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf '### デプロイ\n\n- コミット: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: サイトデータと WASM の用意
        working-directory: web
        run: |
          set -o pipefail
          bash scripts/prepare-assets.sh 2>&1 | tee /tmp/assets.txt
      - name: ビルドと配信の上限
        working-directory: web
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: web/dist/
          retention-days: 1
          if-no-files-found: error
      - name: Summary
        if: always()
        run: |
          strip() { sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$1" 2>/dev/null; }
          files="$(strip /tmp/build.txt | grep -E '^ファイル:' | tail -n 1)"
          limits="$(strip /tmp/build.txt | grep -E '^違反:' | tail -n 1)"
          printf -- '- 配信の上限: %s / %s\n' "${files:-ファイル数を読めなかった}" "${limits:-件数を読めなかった}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Cloudflare へ出す
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: pnpm install(スクリプトは動かさない)
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: web/dist
      - name: 成果物の確認
        working-directory: web
        run: test -f dist/index.html
      # ★トークンはこの段だけに渡す。値をログに出す・形を変えて出す処理を足さない(伏せ字は値そのものにしか効かない)。
      - name: wrangler deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Environment production の secrets(CLOUDFLARE_API_TOKEN・CLOUDFLARE_ACCOUNT_ID)が無い"; exit 1
          fi
          pnpm exec wrangler deploy 2>&1 | tee /tmp/deploy.txt
      - name: Summary
        if: always()
        run: |
          strip() { sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$1" 2>/dev/null; }
          url="$(strip /tmp/deploy.txt | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -n 1)"
          ver="$(strip /tmp/deploy.txt | grep -oE 'Current Version ID: [0-9a-f-]+' | tail -n 1)"
          printf -- '- URL: %s\n- 版: %s\n' "${url:-読めなかった}" "${ver:-読めなかった}" >> "$GITHUB_STEP_SUMMARY"
