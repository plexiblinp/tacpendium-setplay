    <meta property="og:type" content="website" />

    <meta property="og:description" content="SF6 のキャラとダウン後の有利フレームから、起き攻めのレシピ(空振りの繋ぎ → 重ねる技)を出す非公式ツール。" />
    <meta property="og:url" content="https://tacpendium-setplay.plexiblinp.workers.dev/" />
    <meta property="og:image" content="https://tacpendium-setplay.plexiblinp.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tacpendium-Setplay: SF6 setplay suggestions (unofficial)" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- 画面が動き出すまでの表示。止まったときは public/boot.js が理由をここに書く(真っ白にしない)。 -->

    <noscript>JavaScript を有効にしてください / Please enable JavaScript.</noscript>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
